<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AuraBIM Studio — 2D CAD & 3D Interior Design</title>
  <meta name="description" content="Next-generation browser-based 2D CAD drafting and real-time 3D interior design studio with spatial graph architecture." />
  <script>
    (function() {
      var saved = localStorage.getItem('aurabim_theme');
      document.documentElement.setAttribute('data-theme', saved || 'light');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/design-tokens.css" />
  <link rel="stylesheet" href="/src/styles/layout.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <link rel="stylesheet" href="/src/styles/inspector.css" />
  <link rel="stylesheet" href="/src/styles/dashboard.css" />
  <link rel="stylesheet" href="/src/styles/custom-dialog.css" />
</head>
<body>
  <!-- Zone 0A: Authentication Modal View -->
  <div id="auth-container" style="display: none;"></div>

  <!-- Zone 0B: Project Management Dashboard -->
  <div id="dashboard-container" style="display: none;"></div>

  <!-- Zone 0C: Studio CAD/3D Editor -->
  <div id="app-container">
    <!-- Zone 1: Top Command Bar -->
    <header id="top-command-bar"></header>

    <!-- Main Workspace -->
    <main id="main-workspace">
      <!-- Zone 2A: Far Left Navigation Icon Rail -->
      <nav id="nav-rail"></nav>

      <!-- Zone 2B: Left Tool Dock -->
      <aside id="left-dock"></aside>

      <!-- Zone 3: Center Viewport Canvas -->
      <section id="center-viewport">
        <canvas id="cad-canvas"></canvas>
        <canvas id="three-canvas"></canvas>

        <!-- Zone 4: Picture-in-Picture (PiP) Window with 3D/Rooms/Drawing tabs -->
        <div id="pip-window">
          <div class="pip-header">
            <div style="display: flex; align-items: center; gap: 6px;">
              <span class="pip-drag-grip" style="color: #94a3b8; font-size: 13px; cursor: grab; user-select: none;" title="Drag to reposition">⠿</span>
              <div class="pip-tabs">
                <button class="pip-tab" data-tab="3d" id="pip-tab-toggle">2D</button>
                <button class="pip-tab active" data-tab="rooms">Rooms</button>
                <button class="pip-tab" data-tab="drawing">Drawing</button>
              </div>
            </div>
            <div style="display: flex; gap: 4px; align-items: center;">
              <button class="btn btn-icon btn-sm" id="btn-pip-fullscreen" title="Expand View">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
              </button>
              <button class="btn btn-icon btn-sm" id="btn-pip-close" title="Close">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
          </div>
          <div class="pip-canvas-container" id="pip-canvas-slot"></div>
        </div>
      </section>

      <!-- Zone 5: Right Property Inspector -->
      <aside id="right-inspector"></aside>
    </main>

    <!-- Bottom HUD Status Bar -->
    <footer id="status-hud-bar">
      <div class="hud-left" id="hud-telemetry">
        <span class="hud-telemetry-coords" id="hud-coords">X: 0 Y: 0</span>
        <span class="hud-telemetry-sep">|</span>
        <span class="hud-telemetry-constraint" id="hud-snap">Snap: On (100mm)</span>
        <span class="hud-telemetry-sep">|</span>
        <span class="hud-telemetry-constraint" id="hud-ortho">Ortho: Active</span>
      </div>

      <div class="hud-right">
        <button class="hud-pill-btn" id="btn-hud-split" title="Dual Split Screen (2D & 3D Side-by-Side)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="3" x2="12" y2="21"/></svg>
          <span>Split Screen</span>
        </button>
        <button class="hud-pill-btn" id="btn-hud-extents" title="Center View (Fit to Extents)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="22" y1="12" x2="18" y2="12"/><line x1="6" y1="12" x2="2" y2="12"/><line x1="12" y1="6" x2="12" y2="2"/><line x1="12" y1="22" x2="12" y2="18"/></svg>
          <span>Center View</span>
        </button>
        <button class="hud-pill-icon-btn" id="btn-zoom-out" title="Zoom Out">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <span id="hud-zoom-level" class="hud-zoom-pill tabular-nums">100 %</span>
        <button class="hud-pill-icon-btn" id="btn-zoom-in" title="Zoom In">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <div id="toast-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
